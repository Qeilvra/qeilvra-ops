name: Foundation quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airmech_ci
          POSTGRES_DB: airmech_ci
          # Only this disposable runner's loopback port accepts passwordless access.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U airmech_ci -d airmech_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Setup pnpm and cache its store
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the Vercel web target from the app root
        working-directory: apps/web
        run: pnpm --dir ../.. run build:web
        env:
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
      - name: Run the complete quality gate
        run: pnpm check
      - name: Apply infrastructure migrations to disposable PostgreSQL
        run: pnpm db:migrate
        env:
          NODE_ENV: test
          DATABASE_ENABLED: "true"
          DATABASE_URL: postgresql://airmech_ci@127.0.0.1:5432/airmech_ci
      - name: Verify live PostgreSQL and Redis infrastructure
        run: pnpm test:live
        env:
          NODE_ENV: test
          INFRASTRUCTURE_TEST_DATABASE_MUTATIONS: "true"
          DATABASE_ENABLED: "true"
          DATABASE_URL: postgresql://airmech_ci@127.0.0.1:5432/airmech_ci
          REDIS_ENABLED: "true"
          REDIS_URL: redis://127.0.0.1:6379/0
          STORAGE_ENABLED: "false"
